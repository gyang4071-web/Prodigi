<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Prodigi Office</title>
<style>
:root{--ease:cubic-bezier(.22,.8,.22,1)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button{font:inherit}
.stage{position:relative;width:100vw;height:100svh;display:grid;place-items:center;overflow:hidden;background:#111}
.viewport{position:relative;width:min(100vw,calc(100svh * 4 / 3));aspect-ratio:4/3;transform-origin:50% 50%;transition:transform .95s var(--ease),filter .55s ease;will-change:transform}
.scene{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:16px;outline:none;transition:background .22s ease,box-shadow .22s ease}
.hotspot::before{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,0);border-radius:inherit;transition:border-color .22s ease,background .22s ease,box-shadow .22s ease}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(8px);white-space:nowrap;padding:7px 11px;border-radius:999px;background:rgba(8,10,9,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:650;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.hotspot:hover::before,.hotspot:focus-visible::before{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;transform:translate(-50%,-50%) translateY(0)}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* Hotspots mapped to the approved office image. */
.we-lead{left:16.5%;top:4.5%;width:31.4%;height:20.5%}
.we-build{left:49.2%;top:4.5%;width:31.8%;height:20.5%}
.igaming{left:10.5%;top:27%;width:22%;height:48%}
.paid-ads{left:61%;top:20%;width:23%;height:25%}
.native{left:61%;top:42%;width:23%;height:27%}
.coffee{left:78.5%;top:55%;width:19.5%;height:34%}

.chrome{position:fixed;inset:0;pointer-events:none;z-index:20}
.back{pointer-events:auto;position:absolute;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,9,.72);color:#fff;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:650;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(-8px);visibility:hidden;transition:opacity .25s ease,transform .25s ease,visibility .25s}
.back.show{opacity:1;transform:none;visibility:visible}
.focus-title{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,12px);padding:8px 13px;border-radius:999px;background:rgba(8,10,9,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:650;letter-spacing:.02em;opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease,visibility .25s;white-space:nowrap}
.focus-title.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.hint{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(8,10,9,.58);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.02em;transition:opacity .35s ease;animation:hideHint .5s ease 4s forwards}
@keyframes hideHint{to{opacity:0;visibility:hidden}}

body.focused .hotspot{pointer-events:none}
body.focused .hotspot::after,body.focused .hotspot::before{opacity:0!important}

@media (max-width:720px){
  .hotspot::after{font-size:10px;padding:6px 9px}
  .hint{font-size:10px}
  .viewport{width:100vw;height:auto;aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){.viewport,.back,.focus-title,.hotspot::after,.hotspot::before{transition:none!important}.hint{animation:none;display:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Prodigi Office interactive map">
  <div class="viewport" id="viewport">
    <img class="scene" src="office.png" alt="Prodigi Office — Room 1">

    <button class="hotspot we-lead" data-label="WE LEAD" data-x="31.8" data-y="14.8" data-scale="2.05" aria-label="Open WE LEAD"></button>
    <button class="hotspot we-build" data-label="WE BUILD" data-x="65.2" data-y="14.8" data-scale="2.05" aria-label="Open WE BUILD"></button>
    <button class="hotspot igaming" data-label="iGaming" data-x="21.5" data-y="50" data-scale="1.72" aria-label="Open iGaming area"></button>
    <button class="hotspot paid-ads" data-label="Paid Ads" data-x="72.5" data-y="31.5" data-scale="1.92" aria-label="Open Paid Ads area"></button>
    <button class="hotspot native" data-label="Native Network" data-x="72.5" data-y="54.5" data-scale="1.88" aria-label="Open Native Network area"></button>
    <button class="hotspot coffee" data-label="Coffee Corner" data-x="88.2" data-y="72" data-scale="2.05" aria-label="Open Coffee Corner"></button>
  </div>

  <div class="chrome">
    <button class="back" id="backBtn" type="button" aria-label="Back to office">← Office</button>
    <div class="focus-title" id="focusTitle" aria-live="polite"></div>
    <div class="hint" id="hint">Hover a zone · click to explore</div>
  </div>
</main>
<script>
(() => {
  const viewport = document.getElementById('viewport');
  const back = document.getElementById('backBtn');
  const title = document.getElementById('focusTitle');
  const hint = document.getElementById('hint');
  const spots = [...document.querySelectorAll('.hotspot')];

  function openSpot(spot){
    const x = Number(spot.dataset.x);
    const y = Number(spot.dataset.y);
    const scale = Number(spot.dataset.scale || 1.8);
    viewport.style.transformOrigin = `${x}% ${y}%`;
    viewport.style.transform = `scale(${scale})`;
    document.body.classList.add('focused');
    back.classList.add('show');
    title.textContent = spot.dataset.label || '';
    title.classList.add('show');
    hint.style.display = 'none';
  }

  function reset(){
    viewport.style.transform = 'scale(1)';
    viewport.style.transformOrigin = '50% 50%';
    document.body.classList.remove('focused');
    back.classList.remove('show');
    title.classList.remove('show');
  }

  spots.forEach(spot => spot.addEventListener('click', () => openSpot(spot)));
  back.addEventListener('click', reset);
  window.addEventListener('keydown', e => { if(e.key === 'Escape') reset(); });
})();
</script>
</body>
</html>
