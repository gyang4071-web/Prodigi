<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Prodigi Office · Paid Ads</title>
<style>
:root{
  --bg:#101010;
  --panel:#171717;
  --panel2:#111;
  --text:#fff;
  --muted:rgba(255,255,255,.62);
  --muted2:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.12);
  --line2:rgba(255,255,255,.2);
  --yellow:#ffc62a;
  --green:#9cff54;
  --ease:cubic-bezier(.22,.8,.22,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{color:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.app{
  width:100vw;height:100svh;display:grid;
  grid-template-columns:minmax(0,1fr) clamp(500px,34vw,620px);
  background:#0d0d0d;overflow:hidden;
  transition:grid-template-columns .55s var(--ease);
}
.app.panel-closed{grid-template-columns:minmax(0,1fr) 0px}

/* LEFT / OFFICE */
.office-area{
  position:relative;overflow:hidden;background:#111;min-width:0;
}
.office-stage{
  position:absolute;inset:0;display:grid;place-items:center;
}
.office-canvas{
  position:relative;
  width:min(100%,calc(100svh * 1098 / 941));
  aspect-ratio:1098/941;
  flex:none;
}
.office-canvas img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;
}
.paid-zone{
  position:absolute;
  left:59.3%;top:23.5%;width:29.2%;height:18%;
  border:0;background:transparent;border-radius:22px;cursor:pointer;
}
.paid-zone::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  border:1px solid transparent;transition:.2s ease;
}
.paid-zone::after{
  content:"Paid Ads";position:absolute;left:50%;top:-13px;transform:translate(-50%,-100%) translateY(4px);
  opacity:0;white-space:nowrap;background:var(--yellow);color:#151515;
  border-radius:999px;padding:8px 13px;font-size:12px;font-weight:850;
  box-shadow:0 10px 34px rgba(0,0,0,.28);transition:.2s ease;pointer-events:none;
}
.paid-zone:hover::before,.paid-zone:focus-visible::before{
  border-color:rgba(255,198,42,.62);background:rgba(255,198,42,.04);
  box-shadow:0 0 0 1px rgba(255,198,42,.1) inset;
}
.paid-zone:hover::after,.paid-zone:focus-visible::after{opacity:1;transform:translate(-50%,-100%)}
.reopen{
  position:absolute;right:18px;top:18px;z-index:5;
  display:none;border:0;background:var(--yellow);color:#151515;border-radius:999px;
  padding:10px 15px;font-weight:850;cursor:pointer;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}
.panel-closed .reopen{display:block}

/* RIGHT PANEL */
.panel{
  min-width:0;height:100svh;overflow:hidden;
  border-left:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#171717,#0e0e0e);
  box-shadow:-25px 0 65px rgba(0,0,0,.28);
  opacity:1;transition:opacity .3s ease;
}
.panel-closed .panel{opacity:0;pointer-events:none}
.panel-scroll{
  height:100%;overflow:auto;padding:18px 18px 26px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;
}
.panel-top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:14px;
}
.panel-title{display:flex;gap:10px;align-items:flex-start}
.status-dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(156,255,84,.6)}
.panel-title b{display:block;font-size:14px}
.panel-title span{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.close-btn{
  border:1px solid var(--line2);background:rgba(255,255,255,.04);
  border-radius:999px;padding:9px 12px;cursor:pointer;
}
.close-btn:hover{background:rgba(255,255,255,.08)}

/* HERO - no cropping */
.hero{
  position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;
  background:#0b0b0b;
}
.hero img{
  display:block;width:100%;height:auto;object-fit:contain;background:#0b0b0b;
}
.hero-overlay{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.75) 100%);
}
.hero-copy{
  position:absolute;left:18px;right:18px;bottom:15px;z-index:2;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
}
.kicker{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.hero-copy h1{margin:5px 0 2px;font-size:clamp(34px,3.4vw,52px);letter-spacing:-.045em;line-height:.94}
.hero-names{font-size:12px;color:rgba(255,255,255,.78)}
.primary-btn{
  border:0;background:#fff;color:#111;border-radius:999px;padding:10px 14px;
  font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}

/* TEAM */
.section-head{
  display:flex;align-items:end;justify-content:space-between;gap:14px;
  margin:22px 2px 10px;
}
.section-head h2{margin:0;font-size:20px;letter-spacing:-.025em}
.section-head button{
  border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:5px 0;
}
.members{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.member{
  min-width:0;padding:0;overflow:hidden;border:1px solid var(--line);
  border-radius:14px;background:rgba(255,255,255,.035);text-align:left;cursor:pointer;
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.member:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.055)}
.member img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#191919}
.member-copy{padding:8px}
.member b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member small{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.25}

/* GALLERY */
.gallery-block{margin-top:18px}
.gallery-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
.gallery-header h2{margin:0;font-size:18px;letter-spacing:-.025em}
.gallery-header p{margin:4px 0 0;color:var(--muted);font-size:10px}
.gallery-back{
  display:none;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:4px 0;
}
.gallery-back.show{display:block}
.gallery-status{min-height:17px;margin-bottom:7px;color:var(--muted2);font-size:10px}
.gallery-strip{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(98px,1fr);
  grid-template-rows:90px;gap:8px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;
}
.thumb{
  border:0;padding:0;border-radius:11px;overflow:hidden;background:rgba(255,255,255,.05);
  cursor:zoom-in;min-width:98px;
}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.gallery-empty{
  grid-column:1/-1;min-width:100%;height:90px;border:1px dashed rgba(255,255,255,.14);
  border-radius:11px;display:grid;place-items:center;text-align:center;color:var(--muted2);font-size:10px;padding:10px;
}
.add-row{
  margin-top:10px;border:1px dashed rgba(255,255,255,.15);border-radius:15px;padding:12px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.add-row h3{margin:0;font-size:15px}
.add-row p{margin:3px 0 0;color:var(--muted);font-size:10px}
.upload{
  display:inline-flex;align-items:center;gap:7px;border:0;background:var(--yellow);color:#111;
  border-radius:999px;padding:10px 14px;font-weight:850;font-size:11px;cursor:pointer;white-space:nowrap;
}
.upload input{display:none}

/* LIGHTBOX */
.lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);
  display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:.18s ease;
}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{max-width:94vw;max-height:90svh;border-radius:16px;box-shadow:0 28px 100px rgba(0,0,0,.5)}
.lightbox button{
  position:absolute;right:18px;top:18px;border:1px solid var(--line2);background:rgba(20,20,20,.72);
  border-radius:999px;padding:9px 12px;cursor:pointer;
}

/* TABLET / MOBILE */
@media(max-width:1050px){
  body{overflow:auto}
  .app,.app.panel-closed{display:block;height:auto;min-height:100svh}
  .office-area{height:68svh;min-height:520px}
  .panel{height:auto;min-height:100svh;border-left:0;border-top:1px solid rgba(255,255,255,.08);opacity:1!important}
  .panel-closed .panel{display:none}
  .panel-scroll{height:auto;overflow:visible}
  .reopen{display:none!important}
}
@media(max-width:680px){
  .office-area{height:auto;min-height:0;aspect-ratio:1098/941}
  .office-canvas{width:100%;height:100%;aspect-ratio:1098/941}
  .panel-scroll{padding:12px}
  .members{grid-template-columns:repeat(2,minmax(0,1fr))}
  .member img{aspect-ratio:1/1}
  .hero-copy{left:12px;right:12px;bottom:11px;align-items:flex-start;flex-direction:column}
  .primary-btn{padding:8px 11px}
  .hero-copy h1{font-size:34px}
  .add-row{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  .app,.member,.lightbox{transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="office-area" aria-label="Prodigi Office">
    <div class="office-stage">
      <div class="office-canvas">
        <img src="office_paid_ads.png" alt="Prodigi office with Paid Ads team">
        <button class="paid-zone" id="paidZone" aria-label="Open Paid Ads team"></button>
      </div>
    </div>
    <button class="reopen" id="reopen" type="button">Paid Ads →</button>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-scroll" id="panelScroll">
      <div class="panel-top">
        <div class="panel-title">
          <span class="status-dot"></span>
          <div><b>Prodigi · Paid Ads</b><span>Team space & photo galleries</span></div>
        </div>
        <button class="close-btn" id="closePanel" type="button">✕ Close</button>
      </div>

      <section class="hero">
        <img src="paid_ads_team.png" alt="Paid Ads team">
        <div class="hero-overlay"></div>
        <div class="hero-copy">
          <div>
            <div class="kicker">Prodigi · 9 Years</div>
            <h1>Paid Ads</h1>
            <div class="hero-names">Lilit · Maria · Stepan · Albert · Gevorg</div>
          </div>
          <button class="primary-btn" id="viewTeamGallery" type="button">View Gallery →</button>
        </div>
      </section>

      <div class="section-head">
        <h2>Meet the team</h2>
        <button id="seeAll" type="button">Open team gallery →</button>
      </div>

      <div class="members">
        <button class="member" type="button" data-album="lilit" data-title="Lilit">
          <img src="member_lilit.png" alt="Lilit">
          <span class="member-copy"><b>Lilit</b><small>Head of Digital Department</small></span>
        </button>
        <button class="member" type="button" data-album="maria" data-title="Maria Petrosyan">
          <img src="member_maria.png" alt="Maria Petrosyan">
          <span class="member-copy"><b>Maria</b><small>Head of Paid Ads</small></span>
        </button>
        <button class="member" type="button" data-album="stepan" data-title="Stepan">
          <img src="member_stepan.png" alt="Stepan">
          <span class="member-copy"><b>Stepan</b><small>Paid Ads Specialist / Account Manager</small></span>
        </button>
        <button class="member" type="button" data-album="albert" data-title="Albert Azaryan">
          <img src="member_albert.png" alt="Albert Azaryan">
          <span class="member-copy"><b>Albert</b><small>Paid Ads Specialist / Account Manager</small></span>
        </button>
        <button class="member" type="button" data-album="gevorg" data-title="Gevorg Gasparyan">
          <img src="member_gevorg.png" alt="Gevorg Gasparyan">
          <span class="member-copy"><b>Gevorg</b><small>Paid Ads Specialist / Account Manager</small></span>
        </button>
      </div>

      <section class="gallery-block" id="galleryBlock">
        <div class="gallery-header">
          <div>
            <h2 id="galleryTitle">Team Gallery</h2>
            <p id="gallerySubtitle">Moments from our work, events and daily life</p>
          </div>
          <button class="gallery-back" id="galleryBack" type="button">← Team gallery</button>
        </div>
        <div class="gallery-status" id="galleryStatus"></div>
        <div class="gallery-strip" id="galleryStrip"></div>

        <div class="add-row">
          <div>
            <h3 id="addTitle">Add photos</h3>
            <p>Share your photos with the team.</p>
          </div>
          <label class="upload">▣ Add Photos
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          </label>
        </div>
      </section>
    </div>
  </aside>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button id="closeLightbox" type="button">✕</button>
  <img id="lightboxImage" alt="">
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const panelScroll = document.getElementById('panelScroll');
  const paidZone = document.getElementById('paidZone');
  const reopen = document.getElementById('reopen');
  const closePanel = document.getElementById('closePanel');
  const viewTeamGallery = document.getElementById('viewTeamGallery');
  const seeAll = document.getElementById('seeAll');
  const galleryBlock = document.getElementById('galleryBlock');
  const galleryTitle = document.getElementById('galleryTitle');
  const gallerySubtitle = document.getElementById('gallerySubtitle');
  const galleryBack = document.getElementById('galleryBack');
  const galleryStatus = document.getElementById('galleryStatus');
  const galleryStrip = document.getElementById('galleryStrip');
  const addTitle = document.getElementById('addTitle');
  const fileInput = document.getElementById('fileInput');
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const closeLightbox = document.getElementById('closeLightbox');

  let activeAlbum = 'team';
  let activeTitle = 'Team Gallery';

  function openPanel(){
    app.classList.remove('panel-closed');
  }
  function hidePanel(){
    if(window.innerWidth <= 1050) return;
    app.classList.add('panel-closed');
  }
  paidZone.addEventListener('click', openPanel);
  reopen.addEventListener('click', openPanel);
  closePanel.addEventListener('click', hidePanel);

  function scrollGallery(){
    galleryBlock.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function setGallery(album,title){
    activeAlbum = album;
    activeTitle = title;
    galleryTitle.textContent = album === 'team' ? 'Team Gallery' : `${title} Gallery`;
    gallerySubtitle.textContent = album === 'team'
      ? 'Moments from our work, events and daily life'
      : `Photos and memories with ${title}.`;
    addTitle.textContent = album === 'team' ? 'Add photos' : `Add photos to ${title}'s gallery`;
    galleryBack.classList.toggle('show', album !== 'team');
    loadGallery();
  }

  viewTeamGallery.addEventListener('click', () => { setGallery('team','Team Gallery'); scrollGallery(); });
  seeAll.addEventListener('click', () => { setGallery('team','Team Gallery'); scrollGallery(); });
  galleryBack.addEventListener('click', () => setGallery('team','Team Gallery'));

  document.querySelectorAll('.member').forEach(card => {
    card.addEventListener('click', () => {
      setGallery(card.dataset.album, card.dataset.title);
      scrollGallery();
    });
  });

  async function loadGallery(){
    galleryStatus.textContent = 'Loading photos…';
    galleryStrip.innerHTML = '';
    try{
      const response = await fetch(`/api/gallery?action=list&album=${encodeURIComponent(activeAlbum)}`, {cache:'no-store'});
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || 'Could not load gallery');

      const photos = Array.isArray(data.photos) ? data.photos : [];
      galleryStatus.textContent = photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'}` : '';

      if(!photos.length){
        galleryStrip.innerHTML = '<div class="gallery-empty">No photos here yet. Add the first memory.</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      photos.forEach(photo => {
        const btn = document.createElement('button');
        btn.className = 'thumb';
        btn.type = 'button';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = '';
        img.src = photo.url;

        btn.appendChild(img);
        btn.addEventListener('click', () => {
          lightboxImage.src = photo.url;
          lightbox.classList.add('open');
          lightbox.setAttribute('aria-hidden','false');
        });
        frag.appendChild(btn);
      });
      galleryStrip.appendChild(frag);
    }catch(err){
      galleryStatus.textContent = err.message || 'Gallery is temporarily unavailable.';
      galleryStrip.innerHTML = '<div class="gallery-empty">Gallery is temporarily unavailable.</div>';
    }
  }

  async function uploadFile(file){
    const form = new FormData();
    form.append('album', activeAlbum);
    form.append('file', file);

    const response = await fetch('/api/gallery', {method:'POST',body:form});
    let data = {};
    try{ data = await response.json(); }catch{}
    if(!response.ok) throw new Error(data.error || `Upload failed (${response.status})`);
  }

  fileInput.addEventListener('change', async () => {
    const files = [...fileInput.files];
    if(!files.length) return;

    try{
      for(let i=0;i<files.length;i++){
        galleryStatus.textContent = `Uploading ${i+1} of ${files.length}…`;
        await uploadFile(files[i]);
      }
      fileInput.value = '';
      galleryStatus.textContent = 'Uploaded successfully.';
      await loadGallery();
    }catch(err){
      galleryStatus.textContent = err.message || 'Upload failed.';
      fileInput.value = '';
    }
  });

  function closeLightboxNow(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightboxImage.removeAttribute('src');
  }
  closeLightbox.addEventListener('click', closeLightboxNow);
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightboxNow(); });
  window.addEventListener('keydown', e => { if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightboxNow(); });

  loadGallery();
})();
</script>
</body>
</html>
