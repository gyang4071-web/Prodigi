<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Prodigi Office</title>
<style>
:root{--ease:cubic-bezier(.22,.8,.22,1)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{color:inherit}
.stage{position:relative;width:100vw;height:100svh;display:grid;place-items:center;overflow:hidden;background:#111}
.viewport{position:relative;width:min(100vw,calc(100svh * 4 / 3));aspect-ratio:4/3;transform-origin:50% 50%;transition:transform .95s var(--ease),filter .55s ease;will-change:transform}
.scene{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:16px;outline:none;transition:background .22s ease,box-shadow .22s ease}
.hotspot::before{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,0);border-radius:inherit;transition:border-color .22s ease,background .22s ease,box-shadow .22s ease}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(8px);white-space:nowrap;padding:7px 11px;border-radius:999px;background:rgba(8,10,9,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:650;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.hotspot:hover::before,.hotspot:focus-visible::before{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;transform:translate(-50%,-50%) translateY(0)}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:3px}
.we-lead{left:16.5%;top:4.5%;width:31.4%;height:20.5%}
.we-build{left:49.2%;top:4.5%;width:31.8%;height:20.5%}
.igaming{left:10.5%;top:27%;width:22%;height:48%}
.paid-ads{left:61%;top:20%;width:23%;height:25%}
.native{left:61%;top:42%;width:23%;height:27%}
.coffee{left:78.5%;top:55%;width:19.5%;height:34%}
.chrome{position:fixed;inset:0;pointer-events:none;z-index:20}
.back{pointer-events:auto;position:absolute;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,9,.72);color:#fff;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:650;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(-8px);visibility:hidden;transition:opacity .25s ease,transform .25s ease,visibility .25s}
.back.show{opacity:1;transform:none;visibility:visible}
.focus-title{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,12px);padding:8px 13px;border-radius:999px;background:rgba(8,10,9,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:650;letter-spacing:.02em;opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease,visibility .25s;white-space:nowrap}
.focus-title.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.hint{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(8,10,9,.58);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.02em;transition:opacity .35s ease;animation:hideHint .5s ease 4s forwards}
@keyframes hideHint{to{opacity:0;visibility:hidden}}
body.focused .hotspot{pointer-events:none}
body.focused .hotspot::after,body.focused .hotspot::before{opacity:0!important}


/* Paid Ads characters are a separate overlay. The approved office image stays untouched. */
.office-people{position:absolute;inset:0;z-index:4;pointer-events:none}
.mini-person{position:absolute;width:44px;height:78px;filter:drop-shadow(0 7px 7px rgba(0,0,0,.36));transform-origin:50% 100%}
.mini-head{position:absolute;left:50%;top:0;width:34px;height:34px;transform:translateX(-50%);border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.78);background:#d8c7b6;box-shadow:0 2px 5px rgba(0,0,0,.22);z-index:3}
.mini-head img{position:absolute;width:250px;height:auto;max-width:none}
.mini-body{position:absolute;left:50%;top:29px;width:25px;height:32px;transform:translateX(-50%);border-radius:10px 10px 7px 7px;background:#171717;border:1px solid rgba(255,255,255,.2)}
.mini-body.light{background:#f0eee8;border-color:rgba(0,0,0,.18)}
.mini-arm{position:absolute;top:35px;width:6px;height:27px;border-radius:7px;background:#171717}
.mini-body.light~.mini-arm{background:#f0eee8}
.mini-arm.left{left:6px;transform:rotate(10deg)}
.mini-arm.right{right:6px;transform:rotate(-12deg)}
.mini-leg{position:absolute;top:58px;width:7px;height:20px;border-radius:0 0 5px 5px;background:#252525}
.mini-leg.left{left:14px;transform:rotate(3deg)}
.mini-leg.right{right:14px;transform:rotate(-3deg)}
.mini-person.standing{height:82px}
.mini-person.sitting{height:65px;transform:scale(.88)}
.mini-person.sitting .mini-leg{top:56px;height:11px;transform:rotate(77deg)}
.mini-person.sitting .mini-leg.left{left:10px}
.mini-person.sitting .mini-leg.right{right:10px;transform:rotate(-77deg)}
.mini-person::after{content:"";position:absolute;left:50%;bottom:-2px;width:34px;height:7px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.22);filter:blur(2px);z-index:-1}

/* Face crops from the previously approved Paid Ads team artwork. */
.face-maria img{left:-32px;top:-63px}
.face-stepan img{left:-69px;top:-52px}
.face-gevorg img{left:-118px;top:-68px}
.face-albert img{left:-175px;top:-56px}
.face-lilit img{left:-217px;top:-64px}

/* Positions inside Room 1 — decorative only. */
.office-maria{left:64.3%;top:27.4%}
.office-stepan{left:73.6%;top:27.8%}
.office-gevorg{left:65.2%;top:40.2%}
.office-albert{left:73.6%;top:40.4%}
.office-lilit{left:56.6%;top:35.4%;transform:scale(1.04)}

/* Department hero with the earlier team image. */
.team-hero{position:relative;overflow:hidden;border-radius:23px;border:1px solid rgba(255,255,255,.13);min-height:290px;margin:-2px 0 18px;background:#161616}
.team-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 56%;display:block}
.team-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 28%,rgba(0,0,0,.76) 100%)}
.team-hero-copy{position:absolute;left:22px;right:22px;bottom:19px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.team-hero-copy h2{margin:0;font-size:clamp(28px,4vw,52px);line-height:.95;letter-spacing:-.04em}
.team-hero-copy p{margin:7px 0 0;color:rgba(255,255,255,.72);font-size:13px}
.team-hero-badge{white-space:nowrap;padding:8px 12px;border-radius:999px;background:rgba(10,10,10,.7);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700;backdrop-filter:blur(10px)}
.portrait{position:relative;overflow:hidden}
.portrait img{position:absolute;width:400px;height:auto;max-width:none}
.portrait-maria img{left:-51px;top:-100px}
.portrait-stepan img{left:-111px;top:-82px}
.portrait-gevorg img{left:-189px;top:-108px}
.portrait-albert img{left:-280px;top:-90px}
.portrait-lilit img{left:-348px;top:-103px}

.team-shell{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;padding:22px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
.team-shell.show{opacity:1;visibility:visible}
.team-panel{width:min(1120px,96vw);max-height:90svh;overflow:auto;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(25,25,25,.96),rgba(13,13,13,.96));border-radius:28px;box-shadow:0 30px 100px rgba(0,0,0,.5);padding:24px}
.team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.52);margin-bottom:7px}
.team-head h1,.gallery-head h2{margin:0;font-size:clamp(28px,4vw,54px);line-height:.95;letter-spacing:-.04em}
.sub{margin:10px 0 0;color:rgba(255,255,255,.62);font-size:14px}
.icon-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:999px;padding:9px 12px;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.person-card{min-height:180px;text-align:left;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);border-radius:22px;padding:18px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s ease,border-color .2s ease,background .2s ease}
.person-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.075)}
.person-card.team-wide{grid-column:span 2;min-height:180px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.035))}
.avatar{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.1)}
.person-card h3{margin:14px 0 4px;font-size:20px;letter-spacing:-.02em}
.person-card p{margin:0;color:rgba(255,255,255,.56);font-size:13px;line-height:1.45}
.card-open{margin-top:18px;font-size:12px;color:rgba(255,255,255,.78)}
.gallery-view{display:none}
.team-panel.gallery-mode .team-view{display:none}
.team-panel.gallery-mode .gallery-view{display:block}
.gallery-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.gallery-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.upload-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:#fff;color:#111;border-radius:999px;padding:10px 14px;font-weight:750;font-size:13px;cursor:pointer}
.upload-btn input{display:none}
.gallery-note{font-size:12px;color:rgba(255,255,255,.48);margin:8px 0 16px}
.gallery-status{font-size:13px;color:rgba(255,255,255,.66);min-height:20px;margin-bottom:10px}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.photo-card{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.045);cursor:zoom-in}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.empty{grid-column:1/-1;padding:48px 20px;border:1px dashed rgba(255,255,255,.13);border-radius:20px;text-align:center;color:rgba(255,255,255,.48);font-size:14px}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
.lightbox.show{opacity:1;visibility:visible}
.lightbox img{max-width:min(96vw,1400px);max-height:90svh;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.55)}
.lightbox .icon-btn{position:absolute;top:18px;right:18px}

@media (max-width:900px){.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){
  .hotspot::after{font-size:10px;padding:6px 9px}.hint{font-size:10px}.viewport{width:100vw;height:auto;aspect-ratio:4/3}
  .team-shell{padding:10px}.team-panel{padding:16px;border-radius:22px;max-height:94svh}.team-head{margin-bottom:16px}.team-grid{grid-template-columns:1fr}.person-card.team-wide{grid-column:span 1}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-head{flex-direction:column}.gallery-actions{justify-content:flex-start}
}

@media (max-width:720px){
  .mini-person{transform:scale(.78)}
  .office-lilit{transform:scale(.82)}
  .team-hero{min-height:220px}
  .team-hero-copy{left:15px;right:15px;bottom:14px}
  .team-hero-badge{display:none}
}
@media (prefers-reduced-motion:reduce){.viewport,.back,.focus-title,.hotspot::after,.hotspot::before,.team-shell,.person-card,.lightbox{transition:none!important}.hint{animation:none;display:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Prodigi Office interactive map">
  <div class="viewport" id="viewport">
    <img class="scene" src="office.png" alt="Prodigi Office — Room 1">

    <div class="office-people" aria-hidden="true">
      <span class="mini-person sitting office-maria">
        <span class="mini-head face-maria"><img src="paid_ads_team.png" alt=""></span><span class="mini-body"></span><span class="mini-arm left"></span><span class="mini-arm right"></span><span class="mini-leg left"></span><span class="mini-leg right"></span>
      </span>
      <span class="mini-person sitting office-stepan">
        <span class="mini-head face-stepan"><img src="paid_ads_team.png" alt=""></span><span class="mini-body light"></span><span class="mini-arm left"></span><span class="mini-arm right"></span><span class="mini-leg left"></span><span class="mini-leg right"></span>
      </span>
      <span class="mini-person sitting office-gevorg">
        <span class="mini-head face-gevorg"><img src="paid_ads_team.png" alt=""></span><span class="mini-body"></span><span class="mini-arm left"></span><span class="mini-arm right"></span><span class="mini-leg left"></span><span class="mini-leg right"></span>
      </span>
      <span class="mini-person sitting office-albert">
        <span class="mini-head face-albert"><img src="paid_ads_team.png" alt=""></span><span class="mini-body"></span><span class="mini-arm left"></span><span class="mini-arm right"></span><span class="mini-leg left"></span><span class="mini-leg right"></span>
      </span>
      <span class="mini-person standing office-lilit">
        <span class="mini-head face-lilit"><img src="paid_ads_team.png" alt=""></span><span class="mini-body light"></span><span class="mini-arm left"></span><span class="mini-arm right"></span><span class="mini-leg left"></span><span class="mini-leg right"></span>
      </span>
    </div>
    <button class="hotspot we-lead" data-label="WE LEAD" data-x="31.8" data-y="14.8" data-scale="2.05" aria-label="Open WE LEAD"></button>
    <button class="hotspot we-build" data-label="WE BUILD" data-x="65.2" data-y="14.8" data-scale="2.05" aria-label="Open WE BUILD"></button>
    <button class="hotspot igaming" data-label="iGaming" data-x="21.5" data-y="50" data-scale="1.72" aria-label="Open iGaming area"></button>
    <button class="hotspot paid-ads" data-label="Paid Ads" data-x="72.5" data-y="31.5" data-scale="1.92" aria-label="Open Paid Ads team"></button>
    <button class="hotspot native" data-label="Native Network" data-x="72.5" data-y="54.5" data-scale="1.88" aria-label="Open Native Network area"></button>
    <button class="hotspot coffee" data-label="Coffee Corner" data-x="88.2" data-y="72" data-scale="2.05" aria-label="Open Coffee Corner"></button>
  </div>

  <div class="chrome">
    <button class="back" id="backBtn" type="button" aria-label="Back to office">← Office</button>
    <div class="focus-title" id="focusTitle" aria-live="polite"></div>
    <div class="hint" id="hint">Hover a zone · click to explore</div>
  </div>
</main>

<section class="team-shell" id="teamShell" aria-hidden="true">
  <div class="team-panel" id="teamPanel">
    <div class="team-view">
      <div class="team-head">
        <div>
          <div class="eyebrow">Prodigi · Room 1</div>
          <p class="sub">Team space · galleries and memories</p>
        </div>
        <button class="icon-btn" id="closeTeam" type="button">✕</button>
      </div>

      <div class="team-hero">
        <img src="paid_ads_team.png" alt="Paid Ads team">
        <div class="team-hero-copy">
          <div><h2>Paid Ads</h2><p>Maria · Stepan · Gevorg · Albert · Lilit</p></div>
          <div class="team-hero-badge">5 team members</div>
        </div>
      </div>

      <div class="team-grid">
        <button class="person-card team-wide" data-album="team" data-title="Paid Ads — Team Gallery" type="button">
          <div class="avatar">ALL</div>
          <div><h3>Team Gallery</h3><p>Shared moments, office photos and team memories.</p><div class="card-open">Open gallery →</div></div>
        </button>
        <button class="person-card" data-album="lilit" data-title="Lilit" type="button">
          <div class="avatar portrait portrait-lilit"><img src="paid_ads_team.png" alt=""></div><div><h3>Lilit</h3><p>Head of Digital Department</p><div class="card-open">Open gallery →</div></div>
        </button>
        <button class="person-card" data-album="maria" data-title="Maria Petrosyan" type="button">
          <div class="avatar portrait portrait-maria"><img src="paid_ads_team.png" alt=""></div><div><h3>Maria Petrosyan</h3><p>Head of Paid Ads</p><div class="card-open">Open gallery →</div></div>
        </button>
        <button class="person-card" data-album="stepan" data-title="Stepan" type="button">
          <div class="avatar portrait portrait-stepan"><img src="paid_ads_team.png" alt=""></div><div><h3>Stepan</h3><p>Paid Ads Specialist / Account Manager</p><div class="card-open">Open gallery →</div></div>
        </button>
        <button class="person-card" data-album="albert" data-title="Albert Azaryan" type="button">
          <div class="avatar portrait portrait-albert"><img src="paid_ads_team.png" alt=""></div><div><h3>Albert Azaryan</h3><p>Paid Ads Specialist / Account Manager</p><div class="card-open">Open gallery →</div></div>
        </button>
        <button class="person-card" data-album="gevorg" data-title="Gevorg Gasparyan" type="button">
          <div class="avatar portrait portrait-gevorg"><img src="paid_ads_team.png" alt=""></div><div><h3>Gevorg Gasparyan</h3><p>Paid Ads Specialist / Account Manager</p><div class="card-open">Open gallery →</div></div>
        </button>
      </div>
    </div>

    <div class="gallery-view">
      <div class="gallery-head">
        <div>
          <div class="eyebrow">Paid Ads Gallery</div>
          <h2 id="galleryTitle">Gallery</h2>
          <p class="sub">Public gallery · anyone with the link can view and add photos.</p>
        </div>
        <div class="gallery-actions">
          <button class="icon-btn" id="backToTeam" type="button">← Team</button>
          <label class="upload-btn">＋ Add photos<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
        </div>
      </div>
      <div class="gallery-note">JPG, PNG or WebP · up to 4 MB per image.</div>
      <div class="gallery-status" id="galleryStatus"></div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </div>
</section>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="icon-btn" id="closeLightbox" type="button">✕</button>
  <img id="lightboxImg" alt="Gallery photo">
</div>

<script>
(() => {
  const viewport = document.getElementById('viewport');
  const back = document.getElementById('backBtn');
  const title = document.getElementById('focusTitle');
  const hint = document.getElementById('hint');
  const spots = [...document.querySelectorAll('.hotspot')];
  const paidAdsSpot = document.querySelector('.paid-ads');

  const teamShell = document.getElementById('teamShell');
  const teamPanel = document.getElementById('teamPanel');
  const closeTeam = document.getElementById('closeTeam');
  const backToTeam = document.getElementById('backToTeam');
  const galleryTitle = document.getElementById('galleryTitle');
  const galleryStatus = document.getElementById('galleryStatus');
  const photoGrid = document.getElementById('photoGrid');
  const photoInput = document.getElementById('photoInput');
  const galleryCards = [...document.querySelectorAll('.person-card')];
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeLightbox = document.getElementById('closeLightbox');

  let activeAlbum = 'team';

  function openSpot(spot){
    const x = Number(spot.dataset.x);
    const y = Number(spot.dataset.y);
    const scale = Number(spot.dataset.scale || 1.8);
    viewport.style.transformOrigin = `${x}% ${y}%`;
    viewport.style.transform = `scale(${scale})`;
    document.body.classList.add('focused');
    back.classList.add('show');
    title.textContent = spot.dataset.label || '';
    title.classList.add('show');
    hint.style.display = 'none';
  }

  function reset(){
    viewport.style.transform = 'scale(1)';
    viewport.style.transformOrigin = '50% 50%';
    document.body.classList.remove('focused');
    back.classList.remove('show');
    title.classList.remove('show');
  }

  function openTeam(){
    reset();
    teamPanel.classList.remove('gallery-mode');
    teamShell.classList.add('show');
    teamShell.setAttribute('aria-hidden','false');
    hint.style.display = 'none';
  }

  function closeTeamPanel(){
    teamShell.classList.remove('show');
    teamShell.setAttribute('aria-hidden','true');
    teamPanel.classList.remove('gallery-mode');
    photoGrid.innerHTML = '';
    galleryStatus.textContent = '';
  }

  async function loadGallery(){
    galleryStatus.textContent = 'Loading photos…';
    photoGrid.innerHTML = '';
    try{
      const res = await fetch(`/api/gallery?action=list&album=${encodeURIComponent(activeAlbum)}`, { cache:'no-store' });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Could not load gallery');
      const photos = data.photos || [];
      if(!photos.length){
        photoGrid.innerHTML = '<div class="empty">No photos yet. Be the first to add one.</div>';
      } else {
        photos.forEach(photo => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'photo-card';
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = photo.url;
          img.alt = 'Gallery photo';
          card.appendChild(img);
          card.addEventListener('click', () => openLightbox(photo.url));
          photoGrid.appendChild(card);
        });
      }
      galleryStatus.textContent = photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'}` : '';
    }catch(err){
      galleryStatus.textContent = err.message || 'Gallery is temporarily unavailable';
      photoGrid.innerHTML = '<div class="empty">Could not load photos right now.</div>';
    }
  }

  function openGallery(album, displayTitle){
    activeAlbum = album;
    galleryTitle.textContent = displayTitle;
    teamPanel.classList.add('gallery-mode');
    loadGallery();
  }

  async function uploadFile(file){
    const form = new FormData();
    form.append('album', activeAlbum);
    form.append('file', file);
    const res = await fetch('/api/gallery', { method:'POST', body:form });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || `Could not upload ${file.name}`);
  }

  async function uploadSelected(files){
    if(!files.length) return;
    const selected = [...files];
    galleryStatus.textContent = `Uploading 0/${selected.length}…`;
    let done = 0;
    try{
      for(const file of selected){
        await uploadFile(file);
        done += 1;
        galleryStatus.textContent = `Uploading ${done}/${selected.length}…`;
      }
      photoInput.value = '';
      await loadGallery();
    }catch(err){
      galleryStatus.textContent = err.message || 'Upload failed';
      photoInput.value = '';
      await loadGallery();
    }
  }

  function openLightbox(src){
    lightboxImg.src = src;
    lightbox.classList.add('show');
    lightbox.setAttribute('aria-hidden','false');
  }

  function closeLightboxView(){
    lightbox.classList.remove('show');
    lightbox.setAttribute('aria-hidden','true');
    lightboxImg.removeAttribute('src');
  }

  spots.forEach(spot => {
    if(spot === paidAdsSpot) spot.addEventListener('click', openTeam);
    else spot.addEventListener('click', () => openSpot(spot));
  });

  galleryCards.forEach(card => card.addEventListener('click', () => openGallery(card.dataset.album, card.dataset.title)));
  backToTeam.addEventListener('click', () => teamPanel.classList.remove('gallery-mode'));
  closeTeam.addEventListener('click', closeTeamPanel);
  teamShell.addEventListener('click', e => { if(e.target === teamShell) closeTeamPanel(); });
  photoInput.addEventListener('change', e => uploadSelected(e.target.files));
  closeLightbox.addEventListener('click', closeLightboxView);
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightboxView(); });
  back.addEventListener('click', reset);

  window.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(lightbox.classList.contains('show')) return closeLightboxView();
    if(teamShell.classList.contains('show')) return closeTeamPanel();
    reset();
  });
})();
</script>
</body>
</html>
